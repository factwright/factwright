<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Larkspur Energy Careers</title>
    <style>
      /* As Workday's own styles do: a dropdown keeps its pick in a box no one sees. */
      .css-1ho9wd2 { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
    </style>
  </head>
  <body data-whatinput="mouse">
    <div id="root">
      <div dir="ltr">
        <div data-automation-id="header">
          <h1>Larkspur Energy Careers</h1>
          <div data-automation-id="utilityButtonBar">
            <button type="button" data-automation-id="utilityButtonAccountTasksMenu" aria-label="Account">Account</button>
          </div>
        </div>
        <main>
          <div data-automation-id="applyFlowPage">
            <div>
              <div dir="ltr">
                <button type="button" data-automation-id="backToJobPosting" role="link">
                  <span><svg class="wd-icon-arrow-left wd-icon" focusable="false" role="presentation"></svg></span><span>Back to Job Posting</span>
                </button>
              </div>
              <h2 data-automation-id="jobTitleHeading">Senior Product Manager</h2>
            </div>
            <div aria-label="Application Progress">
              <ol data-automation-id="progressBar" style="pointer-events: none;">
                <li data-automation-id="progressBarCompletedStep" style="pointer-events: none;">
                  <div><div color="#0068B5"></div><div><div color="#0068B5"></div></div><div color="#0068B5"></div></div>
                  <label aria-live="polite">completed step 1 of 6</label>
                  <label>My Information</label>
                </li>
                <li data-automation-id="progressBarCompletedStep" style="pointer-events: none;">
                  <div><div color="#0068B5"></div><div><div color="#0068B5"></div></div><div color="#0068B5"></div></div>
                  <label aria-live="polite">completed step 2 of 6</label>
                  <label>My Experience</label>
                </li>
                <li data-automation-id="progressBarCompletedStep" style="pointer-events: none;">
                  <div><div color="#0068B5"></div><div><div color="#0068B5"></div></div><div color="#0068B5"></div></div>
                  <label aria-live="polite">completed step 3 of 6</label>
                  <label>Application Questions</label>
                </li>
                <li data-automation-id="progressBarCompletedStep" style="pointer-events: none;">
                  <div><div color="#0068B5"></div><div><div color="#0068B5"></div></div><div color="#0068B5"></div></div>
                  <label aria-live="polite">completed step 4 of 6</label>
                  <label>Voluntary Disclosures</label>
                </li>
                <li data-automation-id="progressBarCompletedStep" style="pointer-events: none;">
                  <div><div color="#0068B5"></div><div><div color="#0068B5"></div></div><div color="#0068B5"></div></div>
                  <label aria-live="polite">completed step 5 of 6</label>
                  <label>Self Identify</label>
                </li>
                <li data-automation-id="progressBarActiveStep" style="pointer-events: none;">
                  <div><div color="#0068B5"></div><div><div color="#0068B5"></div></div><div color="#0068B5"></div></div>
                  <label aria-live="polite">current step 6 of 6</label>
                  <label>Review</label>
                </li>
              </ol>
            </div>
            <div id="mainContent">
              <div>
                <h3 tabindex="-1">Review</h3>
                <div><abbr>*</abbr>Indicates a required field</div>
                <div data-automation-id="applyFlowReviewPage">
                  <div role="group" aria-labelledby="My-Information-section">
                    <h4 id="My-Information-section">My Information</h4>
                    <div data-automation-id="formField-source"><label>How Did You Hear About Us?</label><div>LinkedIn</div></div>
                    <div data-automation-id="formField-legalName--firstName"><label>First Name</label><div>Ana María</div></div>
                  </div>
                  <div role="group" aria-labelledby="primaryQuestionnaire-section">
                    <h4 id="primaryQuestionnaire-section">Application Questions</h4>
                    <div data-automation-id="richText"><p><b>Why do you want to work at Larkspur Energy?</b></p></div>
                  </div>
                </div>
              </div>
              <div data-automation-id="pageFooter">
                <div><div><button data-automation-id="pageFooterBackButton" font-size="14" height="40">Back</button></div></div>
                <div></div>
                <div><div><button data-automation-id="pageFooterNextButton" font-size="14" height="40">Submit</button></div></div>
              </div>
            </div>
          </div>
        </main>
        <div data-automation-id="footerContainer"><a href="/en-US/LarkspurCareers/privacy">Privacy</a></div>
      </div>
    </div>
  </body>
</html>
