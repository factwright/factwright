<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Preliminary questions - Robotics Software Intern - Saltmarsh Robotics</title>
  </head>
  <body>
    <div class="topbar" data-test="topbar">
      <div class="topbar-job-details">
        <p data-test="topbar-job-title">Robotics Software Intern</p>
        <p data-test="topbar-location">Denver, CO, USA</p>
      </div>
    </div>
    <oc-app-root class="oc-content" ng-version="20.3.31">
      <spl-wrapper>
        <oc-oneclick-form-root>
          <h1>Robotics Software Intern</h1>
          <main>
            <oc-screening-questions>
              <div>
                <oc-screening-questions-form>
                  <div data-test="screening-questions" class="form-section form-section--clean">
                    <h2 class="spl-text-h3">Preliminary questions</h2>
                    <sr-screening-questions-form data-test="screening-questions-form" showtextinputscharacterscounters="">
                      <template>
                        <div class="spl-mt-2" data-test="question-container">
                          <sr-question-field-radio>
                            <spl-radio-group variant="vertical" required="" id="spl-form-element_75" name="question_authorized" value="">
                              <span slot="label-content">Are you legally authorized to work in the United States?</span>
                              <spl-radio label="Yes" tabindex="0" id="spl-form-element_76" value="1" role="radio" aria-checked="false" aria-disabled="false"></spl-radio>
                              <spl-radio label="No" tabindex="-1" id="spl-form-element_77" value="0" role="radio" aria-checked="false" aria-disabled="false"></spl-radio>
                            </spl-radio-group>
                          </sr-question-field-radio>
                        </div>
                        <div class="spl-mt-2" data-test="question-container">
                          <sr-question-field-radio>
                            <spl-radio-group variant="vertical" required="" id="spl-form-element_78" name="question_sponsorship" value="">
                              <span slot="label-content">Will you now or in the future require sponsorship for an employment visa?</span>
                              <spl-radio label="Yes" tabindex="0" id="spl-form-element_79" value="1" role="radio" aria-checked="false" aria-disabled="false"></spl-radio>
                              <spl-radio label="No" tabindex="-1" id="spl-form-element_80" value="0" role="radio" aria-checked="false" aria-disabled="false"></spl-radio>
                            </spl-radio-group>
                          </sr-question-field-radio>
                        </div>
                        <div class="spl-mt-2" data-test="question-container">
                          <sr-question-field-select>
                            <spl-autocomplete data-spl-field="" required="" id="question_education" name="question_education" aria-label="Select What is your highest level of education?" minquerylength="0" nomatcheslabel="No matches">
                              <span slot="label-content">What is your highest level of education?</span>
                              <spl-select-option value="hs" label="High School Diploma or Equivalent"></spl-select-option>
                              <spl-select-option value="bs" label="Bachelor of Science"></spl-select-option>
                              <spl-select-option value="ba" label="Bachelor of Arts"></spl-select-option>
                              <spl-select-option value="ms" label="Master of Science"></spl-select-option>
                              <spl-select-option value="phd" label="PhD"></spl-select-option>
                            </spl-autocomplete>
                          </sr-question-field-select>
                        </div>
                        <div class="spl-mt-2" data-test="question-container">
                          <sr-question-field-text showcharacterscounter="">
                            <spl-input data-spl-field="" maxlength="200" type="text" id="question_robots" name="question_robots">
                              <span slot="label-content">Which robot would you most like to build, and why?</span>
                            </spl-input>
                          </sr-question-field-text>
                        </div>
                        <div class="spl-mt-2" data-test="question-container">
                          <sr-question-field-checkbox>
                            <spl-checkbox data-spl-field="" name="question_declaration" required="" id="question_declaration">
                              <span slot="label-content">I declare that the information in this application is true and complete.</span>
                            </spl-checkbox>
                          </sr-question-field-checkbox>
                        </div>
                        <div class="spl-mt-2" data-test="question-container">
                          <sr-question-field-info><p>The following questions are voluntary. Your answers will not affect your application.</p></sr-question-field-info>
                        </div>
                        <div class="spl-mt-2" data-test="question-container">
                          <sr-question-field-select>
                            <spl-autocomplete data-spl-field="" required="" id="question_gender" name="question_gender" aria-label="Select Gender" minquerylength="0" nomatcheslabel="No matches">
                              <span slot="label-content">Gender</span>
                              <spl-select-option value="g1" label="Female"></spl-select-option>
                              <spl-select-option value="g2" label="Male"></spl-select-option>
                              <spl-select-option value="g3" label="Non-Binary"></spl-select-option>
                              <spl-select-option value="g4" label="I do not wish to disclose"></spl-select-option>
                            </spl-autocomplete>
                          </sr-question-field-select>
                        </div>
                        <div class="spl-mt-2" data-test="question-container">
                          <sr-question-field-radio>
                            <spl-radio-group variant="vertical" required="" id="spl-form-element_81" name="question_hispanic" value="">
                              <span slot="label-content">Are you Hispanic or Latino?</span>
                              <spl-radio label="Yes" tabindex="0" id="spl-form-element_82" value="1" role="radio" aria-checked="false" aria-disabled="false"></spl-radio>
                              <spl-radio label="No" tabindex="-1" id="spl-form-element_83" value="0" role="radio" aria-checked="false" aria-disabled="false"></spl-radio>
                              <spl-radio label="I do not wish to disclose" tabindex="-1" id="spl-form-element_84" value="2" role="radio" aria-checked="false" aria-disabled="false"></spl-radio>
                            </spl-radio-group>
                          </sr-question-field-radio>
                        </div>
                        <div class="spl-mt-2" data-test="question-container">
                          <sr-question-field-radio>
                            <spl-radio-group variant="vertical" required="" id="spl-form-element_85" name="question_veteran" value="">
                              <span slot="label-content">Are you a protected veteran?</span>
                              <spl-radio label="Yes" tabindex="0" id="spl-form-element_86" value="1" role="radio" aria-checked="false" aria-disabled="false"></spl-radio>
                              <spl-radio label="No" tabindex="-1" id="spl-form-element_87" value="0" role="radio" aria-checked="false" aria-disabled="false"></spl-radio>
                              <spl-radio label="Prefer not to answer" tabindex="-1" id="spl-form-element_88" value="2" role="radio" aria-checked="false" aria-disabled="false"></spl-radio>
                            </spl-radio-group>
                          </sr-question-field-radio>
                        </div>
                      </template>
                    </sr-screening-questions-form>
                  </div>
                </oc-screening-questions-form>
                <oc-consent>
                  <div data-test="consent" class="form-section form-section--clean">
                    <div class="spl-flex spl-flex-col">
                      <spl-typography-body>Here you can find details of our <a href="https://saltmarsh.example/privacy" class="ui-privacy-policy" target="_blank">privacy notice</a>.</spl-typography-body>
                      <spl-checkbox data-test="consent-box" required="" id="consent-single">
                        <spl-typography-label slot="label-content" variant="md" class="spl-inline-block">You declare that you have read and agree to the privacy notice of Saltmarsh Robotics.</spl-typography-label>
                      </spl-checkbox>
                    </div>
                  </div>
                </oc-consent>
                <oc-nav-screening-questions>
                  <footer data-test="footer" class="form-section form-section--clean">
                    <oc-button type="secondary" data-test="footer-back" legacyclasses="button--rounded">
                      <spl-button data-test="" aria-label="" type="secondary" stretch="no"><span>Back</span></spl-button>
                    </oc-button>
                    <oc-button type="primary" data-test="footer-submit" legacyclasses="button--rounded">
                      <spl-button data-test="" aria-label="" type="primary" stretch="no"><span>Submit</span></spl-button>
                    </oc-button>
                  </footer>
                </oc-nav-screening-questions>
              </div>
            </oc-screening-questions>
          </main>
          <oc-footer>powered by SmartRecruiters</oc-footer>
        </oc-oneclick-form-root>
      </spl-wrapper>
    </oc-app-root>
  </body>
</html>
