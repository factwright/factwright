<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Larkspur Energy Careers</title>
    <style>
      /* As Workday's own styles do: a dropdown keeps its pick in a box no one sees. */
      .css-1ho9wd2 { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
    </style>
  </head>
  <body data-whatinput="mouse">
    <div id="root">
      <div dir="ltr">
        <div data-automation-id="header">
          <h1>Larkspur Energy Careers</h1>
          <div data-automation-id="utilityButtonBar">
            <button type="button" data-automation-id="utilityButtonAccountTasksMenu" aria-label="Account">Account</button>
          </div>
        </div>
        <main>
          <div data-automation-id="applyFlowPage">
            <div>
              <div dir="ltr">
                <button type="button" data-automation-id="backToJobPosting" role="link">
                  <span><svg class="wd-icon-arrow-left wd-icon" focusable="false" role="presentation"></svg></span><span>Back to Job Posting</span>
                </button>
              </div>
              <h2 data-automation-id="jobTitleHeading">Senior Product Manager</h2>
            </div>
            <div aria-label="Application Progress">
              <ol data-automation-id="progressBar" style="pointer-events: none;">
                <li data-automation-id="progressBarActiveStep" style="pointer-events: none;">
                  <div><div color="#0068B5"></div><div><div color="#0068B5"></div></div><div color="#0068B5"></div></div>
                  <label aria-live="polite">current step 1 of 7</label>
                  <label>Create Account/Sign In</label>
                </li>
                <li data-automation-id="progressBarInactiveStep" style="pointer-events: none;">
                  <div><div color="#0068B5"></div><div><div color="#0068B5"></div></div><div color="#0068B5"></div></div>
                  <label aria-live="polite">step 2 of 7</label>
                  <label>My Information</label>
                </li>
                <li data-automation-id="progressBarInactiveStep" style="pointer-events: none;">
                  <div><div color="#0068B5"></div><div><div color="#0068B5"></div></div><div color="#0068B5"></div></div>
                  <label aria-live="polite">step 3 of 7</label>
                  <label>My Experience</label>
                </li>
                <li data-automation-id="progressBarInactiveStep" style="pointer-events: none;">
                  <div><div color="#0068B5"></div><div><div color="#0068B5"></div></div><div color="#0068B5"></div></div>
                  <label aria-live="polite">step 4 of 7</label>
                  <label>Application Questions</label>
                </li>
                <li data-automation-id="progressBarInactiveStep" style="pointer-events: none;">
                  <div><div color="#0068B5"></div><div><div color="#0068B5"></div></div><div color="#0068B5"></div></div>
                  <label aria-live="polite">step 5 of 7</label>
                  <label>Voluntary Disclosures</label>
                </li>
                <li data-automation-id="progressBarInactiveStep" style="pointer-events: none;">
                  <div><div color="#0068B5"></div><div><div color="#0068B5"></div></div><div color="#0068B5"></div></div>
                  <label aria-live="polite">step 6 of 7</label>
                  <label>Self Identify</label>
                </li>
                <li data-automation-id="progressBarInactiveStep" style="pointer-events: none;">
                  <div><div color="#0068B5"></div><div><div color="#0068B5"></div></div><div color="#0068B5"></div></div>
                  <label aria-live="polite">step 7 of 7</label>
                  <label>Review</label>
                </li>
              </ol>
            </div>
            <div id="mainContent">
              <div>
                <h3 tabindex="-1">Create Account/Sign In</h3>
                <div><abbr>*</abbr>Indicates a required field</div>
                <div data-automation-id="applyFlowSignInPage">
                  <div data-automation-id="signInContent">
                    <h2>Create Account</h2>
                    <div data-automation-id="passwordRulesList"><p>Password Requirements:</p><ul><li>An uppercase character</li><li>A lowercase character</li><li>A number</li><li>At least 8 characters</li></ul></div>
                    <form data-automation-id="signInFormo">
                      <div data-automation-id="formField-email">
                        <label for="input-14">Email Address*</label>
                        <input data-automation-id="email" id="input-14" type="text" autocomplete="email" aria-required="true" aria-invalid="false" />
                      </div>
                      <div data-automation-id="formField-password">
                        <label for="input-15">Password*</label>
                        <input data-automation-id="password" id="input-15" type="password" autocomplete="new-password" />
                      </div>
                      <div data-automation-id="formField-verifyPassword">
                        <label for="input-16">Verify New Password*</label>
                        <input data-automation-id="verifyPassword" id="input-16" type="password" autocomplete="new-password" />
                      </div>
                      <p><a href="/en-US/LarkspurCareers/terms">Terms and Conditions</a> <a href="/en-US/LarkspurCareers/privacy">Applicant Privacy</a></p>
                      <div data-automation-id="formField-">
                        <input type="checkbox" data-automation-id="createAccountCheckbox" id="input-19" /><label for="input-19">I agree</label>
                      </div>
                      <div data-automation-id="noCaptchaWrapper">
                        <div data-automation-id="click_filter" role="button" aria-label="Create Account"></div>
                        <button type="submit" data-automation-id="createAccountSubmitButton">Create Account</button>
                      </div>
                      <button type="submit" data-automation-id="signInLink">Sign In</button>
                      <div style="position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden;">
                        <label for="bee-1">Enter website. This input is for robots only, do not enter if you're human.</label>
                        <input data-automation-id="beecatcher" id="bee-1" name="website" type="text" tabindex="-1" />
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
        <div data-automation-id="footerContainer"><a href="/en-US/LarkspurCareers/privacy">Privacy</a></div>
      </div>
    </div>
  </body>
</html>
