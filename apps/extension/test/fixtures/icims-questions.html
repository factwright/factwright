<!doctype html>

  <body class=" iCIMS_chrome iCIMS_chrome120">
    <div class="iCIMS_MainWrapper iCIMS_QuestionsPage  ">
      <div class="iCIMS_TopHeader">
        <div class="iCIMS_TopHeader_Left"><a class="iCIMS_Anchor_Nav" href="/jobs/intro?in_iframe=1"><span class="iCIMS_NavigationText">Search Again</span></a></div>
        <div class="iCIMS_TopHeader_Right"><span>Returning Candidate?</span> <a class="iCIMS_Anchor_Nav" href="/jobs/4821/robotics-software-engineer/login?loginOnly=1&amp;in_iframe=1">Log back in!</a></div>
      </div>
      <div id="beanErrors"></div>
      <div id="portalAriaLiveStatusDiv" role="status" aria-live="polite" class="iCIMS_508_Label"></div>
      <hr />
      <div class="iCIMS_Steps">
        <ul>
          <li class="iCIMS_Steps_First iCIMS_Steps_Completed" id="Step_profileStep" title="Candidate Profile" style="width: 33.3%">
            <span class="iCIMS_Steps_Content sr-only" title="Candidate Profile">Step &nbsp; 1 &nbsp; of &nbsp; 3. &nbsp; Candidate Profile(Completed Step)</span>
          </li>
          <li class="iCIMS_Steps_Current" id="Step_personQuestionsStep" title="Candidate Questions&nbsp;(Current Step)" style="width: 33.3%">
            <span class="iCIMS_Steps_Content sr-only" title="Candidate Questions&nbsp;(Current Step)">Step &nbsp; 2 &nbsp; of &nbsp; 3. &nbsp; Candidate Questions(Current Step)</span>
          </li>
          <li class="iCIMS_Steps_NotCurrent" id="Step_eeoStep" title="EEO" style="width: 33.3%">
            <span class="iCIMS_Steps_Content sr-only" title="EEO">Step &nbsp; 3 &nbsp; of &nbsp; 3. &nbsp; EEO(Incomplete Step)</span>
          </li>
        </ul>
      </div>
      <div class="iCIMS_PageStepText">Candidate Questions</div>
      <hr />
      <div class="iCIMS_CenteredPageContent">
        <h2 class="iCIMS_SubHeader">Candidate Questions</h2>
        <form method="post" accept-charset="UTF-8" id="questions" name="questions" action="/jobs/4821/robotics-software-engineer/questions?back=&amp;global=&amp;csrf=sample&amp;in_iframe=1" onsubmit="icimsDisableSaveAndSubmitButtons('quesp_form_submit_i', 'quesp_form_save_i', 'questions');">
          <input type="hidden" name="stage" value="0" />
          <input type="hidden" name="login" value="" />
          <div class="iCIMS_ProfileFormTable iCIMS_Table">
            <div class="iCIMS_OddRow iCIMS_TableRow">
              <label tabindex="-1" id="label_Q2414" for="Q2414">Are you currently eligible to work in the United States?*</label><span class="Field_Required"><span class="Field_RequiredStar">* </span></span>
              <div class="iCIMS_InfoData iCIMS_InfoData_Questions iCIMS_TableCell">
                <select id="Q2414" name="Q2414" class="iCIMS_Forms_Global iCIMS_Forms_DropDown form-control" aria-required="true" i_required="true" onchange="pageDirtyFlag=true;"><option value="">— Make a Selection —</option><option value="Yes">Yes</option><option value="No">No</option></select>
              </div>
            </div>
            <div class="iCIMS_EvenRow iCIMS_TableRow">
              <label tabindex="-1" id="label_Q2415" for="Q2415">Do you now or in the future require visa sponsorship to work in the United States?*</label><span class="Field_Required"><span class="Field_RequiredStar">* </span></span>
              <div class="iCIMS_InfoData iCIMS_InfoData_Questions iCIMS_TableCell">
                <select id="Q2415" name="Q2415" class="iCIMS_Forms_Global iCIMS_Forms_DropDown form-control" aria-required="true" i_required="true" onchange="pageDirtyFlag=true;"><option value="">— Make a Selection —</option><option value="Yes">Yes</option><option value="No">No</option></select>
              </div>
            </div>
            <div class="iCIMS_OddRow iCIMS_TableRow">
              <label tabindex="-1" id="label_Q2416" for="Q2416">What are your salary expectations for this role?</label>
              <div class="iCIMS_InfoData iCIMS_InfoData_Questions iCIMS_TableCell"><input type="text" id="Q2416" name="Q2416" class="iCIMS_Forms_Global iCIMS_Forms_TextField form-control" maxlength="255" onchange="pageDirtyFlag=true;" /></div>
            </div>
            <div class="iCIMS_EvenRow iCIMS_TableRow">
              <label tabindex="-1" id="label_Q2417" for="Q2417">Which of our robots have you worked with, and how?</label>
              <div class="iCIMS_InfoData iCIMS_InfoData_Questions iCIMS_TableCell"><textarea id="Q2417" name="Q2417" class="iCIMS_Forms_Global iCIMS_Forms_TextBox form-control" cols="40" rows="6" onchange="pageDirtyFlag=true;"></textarea></div>
            </div>
          </div>
          <div class="iCIMS_ButtonRow">
            <input type="submit" id="quesp_form_save_i" name="save" class="iCIMS_SecondaryButton" value="Finish Later" />
            <input type="submit" id="quesp_form_submit_i" class="iCIMS_PrimaryButton" value="Submit" />
          </div>
        </form>
      </div>
      <div class="iCIMS_Logo"><a href="https://icims.help" target="_blank">Application FAQs</a></div>
    </div>
