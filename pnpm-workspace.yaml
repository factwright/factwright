packages:
  - apps/*
  - packages/*

catalog:
  '@biomejs/biome': 2.5.15
  '@playwright/test': 1.63.0
  '@testing-library/dom': 10.4.2
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.7
  '@types/node': 24.19.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@xterm/addon-fit': 0.11.0
  '@xterm/xterm': 6.0.0
  axe-core: 4.13.0
  electron: 43.7.7
  jsdom: 30.1.1
  lucide-react: 1.51.0
  node-pty: 1.1.0
  pdfjs-dist: 6.4.299
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 7.0.2
  vite: 8.3.2
  vitest: 5.0.3

# Packages allowed to run install scripts. node-pty's pick its prebuilt binary.
allowBuilds:
  node-pty: true

# pdf.js's canvas for Node, which the app never uses: it draws resumes in the window.
ignoredOptionalDependencies:
  - '@napi-rs/canvas'
