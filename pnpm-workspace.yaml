# Packages allowed to run install scripts. node-pty's pick its prebuilt binary. esbuild's and
# workerd's only check their platform binary, which comes as an optional dependency anyway.
# electron-winstaller's is for Squirrel installers, which Factwright doesn't make: its Windows
# installer is NSIS.
allowBuilds:
  electron-winstaller: false
  esbuild: false
  node-pty: true
  workerd: false

# pdf.js's canvas for Node, which the app never uses: it draws resumes in the window.
ignoredOptionalDependencies:
  - '@napi-rs/canvas'
