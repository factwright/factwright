name: Windows

# Factwright runs on Windows too. Windows minutes cost twice as much on the free plan, so this
# runs once a week, by hand, and when this file changes, rather than on every change.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows.yml

permissions:
  contents: read

jobs:
  windows:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Each package's tests run even when another's fail, and the app's own run below goes ahead
      # too, so one run shows every problem on Windows.
      - run: pnpm --recursive --no-bail --if-present run test
      - name: Download Electron
        id: electron
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node apps/desktop/node_modules/electron/install.js
      - id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @factwright/desktop build
      # A stand-in Claude Code, claude.cmd, answers the app's runs. The runner's screen is 1024 by
      # 768, which keeps the app's window narrow: E2E_NARROW=1 shows the same on a Mac or Linux.
      - if: ${{ !cancelled() && steps.electron.outcome == 'success' && steps.build.outcome == 'success' }}
        run: pnpm --filter @factwright/desktop e2e
