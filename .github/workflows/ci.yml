name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download Electron
        run: node apps/desktop/node_modules/electron/install.js
      # Ubuntu blocks the user namespaces Chromium's sandbox needs, so allow them for this run.
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm --filter @factwright/desktop build
      # A virtual display for the app's window. A stand-in Claude Code answers its runs.
      - run: xvfb-run -a pnpm --filter @factwright/desktop e2e

  fill:
    name: Filling a form in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu blocks the user namespaces Chromium's sandbox needs, so allow them for this run.
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Download Chromium
        run: pnpm --filter @factwright/site exec playwright install --with-deps chromium
      # The panel fills a form served on the runner, through the desktop app's helper, built with
      # gcc, and the app's own inbox and fill code.
      - run: pnpm --filter @factwright/extension e2e:fill
      # And through sync, from a job hunt the app's own sync put on a local sync server, as on a
      # computer without Factwright.
      - run: pnpm --filter @factwright/extension e2e:sync-fill

  firefox:
    name: The extension in Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Firefox 158 from Mozilla, checked against the hash Mozilla published for it: 157, the
      # runners' own for now, doesn't let WebDriver BiDi click in an extension's own pages.
      - name: Download Firefox
        run: |
          curl -fsSL -o "$RUNNER_TEMP/firefox.tar.xz" https://archive.mozilla.org/pub/firefox/releases/158.0/linux-x86_64/en-US/firefox-158.0.tar.xz
          echo "9549b054ec4cf85f50f6a19d8c6fb79580312e71ebc4ec2cb217ec9af09dc12a  $RUNNER_TEMP/firefox.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/firefox.tar.xz" -C "$RUNNER_TEMP"
      # Saving to Factwright on this computer in it, with gcc for the desktop app's helper.
      - run: pnpm --filter @factwright/extension e2e:firefox
        env:
          FIREFOX: ${{ runner.temp }}/firefox/firefox
      # Filling a form in it: reading, filling and uploading through its content-script sandbox.
      - run: pnpm --filter @factwright/extension e2e:firefox-fill
        env:
          FIREFOX: ${{ runner.temp }}/firefox/firefox
