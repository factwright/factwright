name: Release

# Builds, signs and publishes Factwright's installers. Pushing a tag such as v0.1.0 on main
# releases that version: the installers go to downloads.factwright.com, where installed copies
# find them as an update. Running it by hand, or a pull request that changes how the installers
# are made, builds and tests them without publishing them, unsigned if signing isn't set up yet,
# as the run's artifacts. Mac minutes cost ten times as much on the free plan, so it runs only for
# these. docs/releasing.md has the steps.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # A change to how the installers are made is tried before it merges, without publishing.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/electron-builder.config.mjs
      - apps/desktop/build/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASING: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  mac:
    name: Mac installers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag and its notes
        if: env.RELEASING == 'true'
        run: pnpm --filter @factwright/desktop release-check "$GITHUB_REF_NAME"
      # A release is always signed and notarized. A run by hand may not be, to try the build.
      - name: Signing credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notarize.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/notarize.p8" >> "$GITHUB_ENV"
          fi
          if [ "$RELEASING" = true ] && { [ -z "$CSC_LINK" ] || [ -z "$APPLE_API_KEY_P8" ]; }; then
            echo "::error::A release needs the Developer ID certificate and the notarization key: see docs/releasing.md."
            exit 1
          fi
      - run: pnpm --filter @factwright/desktop build
      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm --filter @factwright/desktop dist:mac
      - name: Check Gatekeeper accepts it
        if: env.RELEASING == 'true'
        run: |
          codesign --verify --deep --strict apps/desktop/dist/mac-universal/Factwright.app
          spctl --assess --type execute --verbose=4 apps/desktop/dist/mac-universal/Factwright.app
      # The installed app, started as a user would, with a stand-in Claude Code.
      - run: pnpm --filter @factwright/desktop e2e:packaged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-mac.yml

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag and its notes
        if: env.RELEASING == 'true'
        run: pnpm --filter @factwright/desktop release-check "$env:GITHUB_REF_NAME"
      - name: Signing credentials
        if: env.RELEASING == 'true'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if (-not $env:AZURE_CLIENT_ID) {
            Write-Output "::error::A release needs Azure Artifact Signing: see docs/releasing.md."
            exit 1
          }
      - run: pnpm --filter @factwright/desktop build
      - name: Build and sign
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: asa-neatifaisigning
          AZURE_CERTIFICATE_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
        run: pnpm --filter @factwright/desktop dist:win
      - name: Check the installer is signed
        if: env.RELEASING == 'true'
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem apps/desktop/dist/*.exe) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) isn't signed: $($signature.Status)" }
            Write-Output "$($file.Name): $($signature.SignerCertificate.Subject)"
          }
      # The installed app, started as a user would, with a stand-in Claude Code (claude.cmd).
      - run: pnpm --filter @factwright/desktop e2e:packaged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml

  publish:
    name: Publish to downloads.factwright.com
    needs: [mac, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 doesn't take the checksums newer AWS tools add to every upload unless asked.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      BUCKET: s3://factwright-downloads
      ENDPOINT: https://c4df27faf7b8fc65b74097415e723d3e.r2.cloudflarestorage.com
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Upload the installers
        run: |
          version="${GITHUB_REF_NAME#v}"
          upload() { aws s3 cp "$1" "$BUCKET/$2" --endpoint-url "$ENDPOINT" --no-progress "${@:3}"; }
          # Each version's files never change, so they're kept by browsers and Cloudflare for good.
          for file in dist/*.dmg dist/*.zip dist/*.exe dist/*.blockmap; do
            upload "$file" "$(basename "$file")" --cache-control "public, max-age=31536000, immutable"
          done
          # The website's links: the newest of each, under one name that never changes.
          upload "dist/Factwright-$version.dmg" Factwright.dmg --cache-control no-cache
          upload "dist/Factwright-Setup-$version.exe" Factwright-Setup.exe --cache-control no-cache
          # The update feeds go last, so an installed copy finds a version only once its files are there.
          upload dist/latest-mac.yml latest-mac.yml --cache-control no-cache --content-type text/yaml
          upload dist/latest.yml latest.yml --cache-control no-cache --content-type text/yaml
      - name: Check the feeds name this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for feed in latest-mac.yml latest.yml; do
            curl --fail --silent "https://downloads.factwright.com/$feed" | grep -q "^version: $version$"
          done
