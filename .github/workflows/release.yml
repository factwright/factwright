name: Release

# Builds, signs and publishes Factwright's installers. Pushing a tag such as v0.1.0 on main
# releases that version: the installers go to downloads.factwright.com, where installed copies
# find them as an update, and once both computers' are out, the version gets a release on GitHub
# with its notes. While the repository is public, each installer also gets a signed record of the
# commit and run that built it, which `gh attestation verify` checks. A run by hand on a tag does
# the same, and like any release refuses to replace a version already published. Run by hand on a
# branch, or on a pull request that changes how the installers are made, it builds and tests them
# without publishing them, as the run's artifacts: on a branch, signed and checked as a release is
# if signing is set up, and on a pull request, which never gets the signing keys, signed only for
# the computer it's on. Mac minutes cost ten times as much on the free plan, so it runs only for
# these. docs/releasing.md has the steps.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/electron-builder.config.mjs
      - apps/desktop/build/**
      - pnpm-workspace.yaml

permissions:
  contents: read

# Releases go one at a time, whatever their tag, and publishing refuses a version older than the
# one out, so an older one can't land after a newer one, even from a late re-run.
# A pull request's run gives way to its next push.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-publish' || format('release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RELEASING: ${{ startsWith(github.ref, 'refs/tags/v') }}
  # Signing keys never reach a pull request's run.
  SIGNING: ${{ github.event_name != 'pull_request' }}
  # Only Factwright's own builds, made here outside pull requests, get its sync server and download
  # site. A fork's, or a pull request's, are built without them, so they never sync or look for
  # updates through Factwright's.
  FACTWRIGHT_SYNC_SERVER: ${{ github.repository == 'factwright/factwright' && github.event_name != 'pull_request' && 'https://app.factwright.com' || '' }}
  FACTWRIGHT_DOWNLOADS_URL: ${{ github.repository == 'factwright/factwright' && github.event_name != 'pull_request' && 'https://downloads.factwright.com/' || '' }}

jobs:
  check:
    name: Check the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: The tag is on main, names the app's version, and has its notes
        if: env.RELEASING == 'true'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags go on main, and $GITHUB_REF_NAME isn't."
            exit 1
          fi
          node apps/desktop/scripts/release-check.ts "$GITHUB_REF_NAME"
      # A release built without them would leave everyone who installs it unable to sync, and
      # stuck on it for good, as it would never look for updates.
      - name: It's built with Factwright's sync server and download site
        if: env.RELEASING == 'true'
        run: |
          if [ -z "$FACTWRIGHT_SYNC_SERVER" ] || [ -z "$FACTWRIGHT_DOWNLOADS_URL" ]; then
            echo "::error::Releases are built only in factwright/factwright, which gets Factwright's sync server and download site."
            exit 1
          fi
      # Each computer's version is checked, as each goes out on its own. A version taken back stops
      # here, before any build, as publishing would refuse it anyway.
      - name: It's newer than the version out now, and wasn't taken back
        if: env.RELEASING == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl --silent --fail --output /dev/null "https://downloads.factwright.com/feeds/$version/withdrawn"; then
            echo "::error::Factwright $version was taken back, so it can't go out again. Release the next version instead."
            exit 1
          fi
          for feed in latest-mac.yml latest.yml; do
            live=$(curl --silent --fail "https://downloads.factwright.com/$feed" | sed -n 's/^version: //p' || true)
            newest=$(printf '%s\n%s\n' "$live" "$version" | sort -V | tail -1)
            if [ -n "$live" ] && { [ "$live" = "$version" ] || [ "$newest" != "$version" ]; }; then
              echo "::error::Factwright $live is out already, so $version can't be released after it."
              exit 1
            fi
          done

  mac:
    name: Mac installers
    needs: check
    runs-on: macos-latest
    # Apple usually notarizes in minutes, but can hold an app for hours, and Mac minutes count ten
    # times. A slow notarization stops here instead of using up the month's free minutes. Apple
    # carries on, and re-running the job sends the app again, which then usually goes quickly.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A release is always signed and notarized. A run by hand may not be, to try the build.
      - name: Signing credentials
        env:
          CSC_LINK: ${{ env.SIGNING == 'true' && secrets.CSC_LINK || '' }}
          APPLE_API_KEY_P8: ${{ env.SIGNING == 'true' && secrets.APPLE_API_KEY_P8 || '' }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notarize.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/notarize.p8" >> "$GITHUB_ENV"
          fi
          if [ "$RELEASING" = true ] && { [ -z "$CSC_LINK" ] || [ -z "$APPLE_API_KEY_P8" ]; }; then
            echo "::error::A release needs the Developer ID certificate and the notarization key: see docs/releasing.md."
            exit 1
          fi
          # A build signed and notarized, as every release is, gets Gatekeeper's check below.
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            echo "NOTARIZED=true" >> "$GITHUB_ENV"
          fi
      - run: pnpm --filter @factwright/desktop build
      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ env.SIGNING == 'true' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ env.SIGNING == 'true' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ env.SIGNING == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ env.SIGNING == 'true' && secrets.APPLE_API_ISSUER || '' }}
          # electron-builder skips signing on a pull request unless asked: there, with no
          # certificate, it signs for this computer alone, so the build is still a real one.
          CSC_FOR_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: pnpm --filter @factwright/desktop dist:mac
      - name: Check what's in the app
        run: pnpm --filter @factwright/desktop check-package
      # Apple's ticket is stapled to the app, so a Mac opens it without going online. The
      # certificate is from Apple's G2 authority: one from the previous authority can't sign after
      # 2027-02-01.
      - name: Check Gatekeeper accepts it
        if: env.NOTARIZED == 'true'
        run: |
          app=apps/desktop/dist/mac-universal/Factwright.app
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          codesign --display --extract-certificates="$RUNNER_TEMP/signer" "$app"
          if ! openssl x509 -inform DER -in "$RUNNER_TEMP/signer0" -noout -issuer | grep -q 'OU=G2'; then
            echo "::error::The Developer ID certificate isn't from Apple's G2 authority: see docs/releasing.md."
            exit 1
          fi
      # The built app, started as a user would, with a stand-in Claude Code.
      - run: pnpm --filter @factwright/desktop e2e:packaged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-mac.yml

  windows:
    name: Windows installer
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A signed build, as every release is, gets the signature check below.
      - name: Signing credentials
        env:
          AZURE_CLIENT_ID: ${{ env.SIGNING == 'true' && secrets.AZURE_CLIENT_ID || '' }}
        run: |
          if ($env:AZURE_CLIENT_ID) {
            "SIGNED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } elseif ($env:RELEASING -eq 'true') {
            Write-Output "::error::A release needs Azure Artifact Signing: see docs/releasing.md."
            exit 1
          }
      - run: pnpm --filter @factwright/desktop build
      # The build stops if signing is set up but the publisher's name, which installed copies check
      # every update against, isn't.
      - name: Build and sign
        env:
          AZURE_TENANT_ID: ${{ env.SIGNING == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ env.SIGNING == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ env.SIGNING == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: asa-neatifaisigning
          AZURE_CERTIFICATE_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
        run: pnpm --filter @factwright/desktop dist:win
      - name: Check what's in the app
        run: pnpm --filter @factwright/desktop check-package
      # Every program and module signed, so Windows runs each one. The app and its installer are
      # signed by the publisher installed copies check each update against, which their update
      # settings name.
      - name: Check everything is signed
        if: env.SIGNED == 'true'
        shell: pwsh
        env:
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
        run: |
          $expected = $env:AZURE_PUBLISHER_NAME
          $ours = @(Get-ChildItem apps/desktop/dist/*.exe) + @(Get-Item apps/desktop/dist/win-unpacked/Factwright.exe)
          $all = $ours + @(Get-ChildItem apps/desktop/dist/win-unpacked -Recurse -Include *.exe, *.node, *.dll)
          foreach ($file in $all) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.FullName) isn't signed: $($signature.Status)" }
          }
          foreach ($file in $ours) {
            $name = (Get-AuthenticodeSignature $file.FullName).SignerCertificate.GetNameInfo('SimpleName', $false)
            if ($name -ne $expected) { throw "$($file.Name) is signed by $name, not $expected" }
          }
          Write-Output "$($all.Count) files signed; the app and its installer by $expected."
          # A build with a download site looks for updates, and takes only this publisher's.
          if ($env:FACTWRIGHT_DOWNLOADS_URL) {
            $settings = Get-Content apps/desktop/dist/win-unpacked/resources/app-update.yml -Raw
            if (-not $settings.Contains($expected)) { throw "Installed copies wouldn't check updates against $expected" }
          }
      # The built app, started as a user would, with a stand-in Claude Code (claude.cmd).
      - run: pnpm --filter @factwright/desktop e2e:packaged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml

  # Each computer's installers go out as soon as its own build passes, so Windows never waits on
  # Apple's notarization. If one fails, re-running the run's failed jobs sends it out after.
  publish-mac:
    name: Publish the Mac installers
    needs: mac
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Signing an installer's record needs a token from GitHub, and somewhere to keep the record.
    permissions: &attest
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mac
          path: dist
      # A record, signed through Sigstore and kept by GitHub, of the commit, tag and run that built
      # each installer, so anyone can check a download came from here. It's made before anything
      # goes out, so every published installer has one. GitHub's free plan only keeps these for
      # public repositories, so while this one is private there's nothing to make.
      - name: Record where the installers came from
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip
      # R2's keys reach only this step.
      - run: apps/desktop/scripts/publish.sh mac "${GITHUB_REF_NAME#v}" dist
        env: &r2
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 doesn't take the checksums newer AWS tools add to every upload unless asked.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          BUCKET: factwright-downloads
          ENDPOINT: https://c4df27faf7b8fc65b74097415e723d3e.r2.cloudflarestorage.com

  publish-windows:
    name: Publish the Windows installer
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: *attest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows
          path: dist
      - name: Record where the installer came from
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.exe
      - run: apps/desktop/scripts/publish.sh windows "${GITHUB_REF_NAME#v}" dist
        env: *r2

  # Once both computers' installers are out, the version gets a release on GitHub: its notes, links
  # to its own installers on downloads.factwright.com, where installed copies look for updates, and
  # while the repository is public, how to check one. Re-running failed jobs reaches this too, and
  # updates the release if it's there already.
  github-release:
    name: Release on GitHub
    needs: [publish-mac, publish-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTED: ${{ !github.event.repository.private }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A version taken back gets no release, even from a re-run of this job alone.
          if curl --silent --fail --output /dev/null "https://downloads.factwright.com/feeds/$version/withdrawn"; then
            echo "::notice::Factwright $version was taken back, so it gets no release on GitHub."
            exit 0
          fi
          notes="$RUNNER_TEMP/notes.md"
          cp "apps/desktop/release-notes/$version.md" "$notes"
          cat >> "$notes" <<NOTES

          ## Download
          - **Mac:** [Factwright-$version.dmg](https://downloads.factwright.com/Factwright-$version.dmg), for Apple silicon and Intel, on macOS 12 or later
          - **Windows:** [Factwright-Setup-$version.exe](https://downloads.factwright.com/Factwright-Setup-$version.exe), for 64-bit Windows 10 and 11

          Copies already installed update on their own.
          NOTES
          # The check names this workflow and the version's tag, so it fails for a record from any other
          # workflow or version.
          if [ "$ATTESTED" = true ]; then
            cat >> "$notes" <<NOTES

          Each installer comes with a signed record of the commit and run that built it. To check one, with the GitHub CLI signed in:

          \`\`\`
          gh attestation verify Factwright-$version.dmg -R $GITHUB_REPOSITORY --signer-workflow ${GITHUB_WORKFLOW_REF%@*} --source-ref $GITHUB_REF
          gh attestation verify Factwright-Setup-$version.exe -R $GITHUB_REPOSITORY --signer-workflow ${GITHUB_WORKFLOW_REF%@*} --source-ref $GITHUB_REF
          \`\`\`
          NOTES
          fi
          # GitHub makes a new release the latest unless told otherwise, so a late re-run of an older
          # version's release says not to, and leaves "Latest" on the newer one.
          newest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2> /dev/null || true)
          latest=true
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "${newest#v}" "$version" | sort -V | tail -1)" != "$version" ]; then
            latest=false
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Factwright $version" --notes-file "$notes" --latest="$latest"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Factwright $version" --notes-file "$notes" --latest="$latest"
          fi
